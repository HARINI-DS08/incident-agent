services:
  - type: web
    name: incident-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_KEY
        sync: false
      - key: INCIDENT_API_BASE
        value: https://aipipe.org/openai/v1
      - key: INCIDENT_MODEL
        value: gpt-4o-mini
