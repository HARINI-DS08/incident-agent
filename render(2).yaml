services:
  - type: web
    name: incident-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
